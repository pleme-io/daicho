[workspace]
members = ["tojime", "genbo", "daicho"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
homepage = "https://github.com/pleme-io/daicho"
repository = "https://github.com/pleme-io/daicho"
readme = "README.md"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# ── THE CRATE BUDGET IS A FIRST-CLASS INVARIANT ────────────────────────
# The whole reason this engine exists rather than a `gix` border is that
# `gix` costs +172 crates, `aws-lc-sys` and cmake to reach a capability it
# then cannot expose (the partial-clone `filter`). Re-acquiring that weight
# here would forfeit the trade. Measured budget, checked by
# `tests/crate_budget.rs`: pure Rust, zero C, zero cmake, zero build.rs.
#
# zlib-rs over flate2+miniz_oxide: zlib-rs has `build = false` and ZERO
# non-optional dependencies, and gix itself switched to it
# (gix-features-0.48.1 `zlib = ["dep:zlib-rs"]`). flate2's rust_backend is
# also pure Rust but costs flate2 + miniz_oxide + crc32fast + adler2 and is
# the slower decompressor.
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
sha1 = "0.10"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
